name: Deploy to GitHub Pages
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected-default-sha:
        description: Exact default-branch commit to publish; empty uses current main
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Find successful CI for this exact default commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/deployment.py
      - name: Use the validated build
        uses: actions/download-artifact@v8.0.1
        with:
          name: site-dist
          path: dist/
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Recheck current revision and CI before publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CI_RUN_ID: ${{ steps.ci.outputs.run-id }}
          EXPECTED_CI_ATTEMPT: ${{ steps.ci.outputs.run-attempt }}
        run: python3 .github/scripts/deployment.py
      - uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist
          cname: portaler.edb.fi
